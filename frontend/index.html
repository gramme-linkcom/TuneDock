<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TuneDock</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>TuneDock</h1>

      <button id="homeBtn">Home</button>
      <button id="tracksBtn">Tracks</button>
      <button id="albumsBtn">Albums</button>
      <button id="libraryUpdateBtn">Library Update</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <input id="searchInput" type="text" placeholder="Search is coming soon..." disabled />
      </header>

      <section>
        <h2>Tracks</h2>
        <div id="trackList" class="track-list"></div>
      </section>
    </main>

    <footer class="player">
      <img id="playerCover" class="player-cover" src="" alt="" />
      <div class="player-info">
        <div id="playerTitle">No track selected</div>
        <div id="playerMeta">TuneDock</div>
      </div>

      <audio id="audioPlayer" controls></audio>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
